name: Screen Reader Accessibility Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: nvda-runner
  cancel-in-progress: false

jobs:
  audit:
    runs-on: [self-hosted, windows, nvda-windows]
    timeout-minutes: 45

    steps:
      - name: Checkout developer code
        uses: actions/checkout@v4

      - name: Start NVDA
        shell: powershell
        run: |
          $nvda = "C:\Program Files (x86)\NVDA\nvda.exe"
          if (Test-Path $nvda) {
            Start-Process $nvda
            Start-Sleep -Seconds 5
            Write-Host "NVDA started"
          } else {
            Write-Host "ERROR: NVDA not found at $nvda"
            exit 1
          }

      - name: Run accessibility audit
        shell: powershell
        env:
          PYTHONUTF8: "1"
        run: |
          C:\Users\dixan\Documents\sr-agent\run_audit.bat `
            --repo-path "$env:GITHUB_WORKSPACE" `
            --config "test_config.yml"

      - name: Stop NVDA
        if: always()
        continue-on-error: true
        shell: powershell
        run: |
          try {
            & "C:\Program Files (x86)\NVDA\nvda.exe" -q 2>&1 | Out-Null
          } catch {}
          Start-Sleep -Seconds 2
          try {
            taskkill /F /IM nvda.exe 2>&1 | Out-Null
          } catch {}
          Write-Host "NVDA cleanup attempted"
          exit 0

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-report
          path: audit_output
          if-no-files-found: error

      - name: Comment results on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const dir = path.join(process.env.GITHUB_WORKSPACE, 'audit_output');
            if (!fs.existsSync(dir)) {
              console.log('No audit_output directory; skipping comment');
              return;
            }
            const files = fs.readdirSync(dir).filter(f => f.endsWith('.md')).sort();
            if (files.length === 0) {
              console.log('No markdown files; skipping comment');
              return;
            }
            const sections = files.map(f => fs.readFileSync(path.join(dir, f), 'utf8'));
            let body = '## Screen Reader Accessibility Audit\n\n' +
                       `Results from ${files.length} goal${files.length > 1 ? 's' : ''}:\n\n` +
                       sections.join('\n\n---\n\n');
            if (body.length > 60000) {
              body = body.slice(0, 60000) + '\n\n*(truncated — see artifact for full report)*';
            }
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });