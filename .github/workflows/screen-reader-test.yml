name: Screen Reader Accessibility Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: nvda-runner
  cancel-in-progress: false

jobs:
  audit:
    runs-on: [self-hosted, windows, nvda-windows]
    timeout-minutes: 30

    steps:
      - name: Checkout developer code
        uses: actions/checkout@v4

      - name: Start NVDA
        shell: powershell
        run: |
          $nvda = "C:\Program Files (x86)\NVDA\nvda.exe"
          if (Test-Path $nvda) {
            Start-Process $nvda
            Start-Sleep -Seconds 5
            Write-Host "NVDA started"
          } else {
            Write-Host "ERROR: NVDA not found at $nvda"
            exit 1
          }

      - name: Run accessibility audit
        shell: powershell
        env:
          PYTHONUTF8: "1"
        run: |
          C:\Users\dixan\Documents\sr-agent\run_audit.bat `
            --repo-path "$env:GITHUB_WORKSPACE" `
            --config "test_config.yml"

      - name: Stop NVDA
        if: always()
        continue-on-error: true
        shell: powershell
        run: |
          & "C:\Program Files (x86)\NVDA\nvda.exe" -q 2>$null
          Start-Sleep -Seconds 2
          taskkill /F /IM nvda.exe 2>$null
          Write-Host "NVDA cleanup attempted"
          exit 0

      - name: List audit output
        if: always()
        shell: powershell
        run: |
          $dir = Join-Path $env:GITHUB_WORKSPACE ".audit_output"
          if (Test-Path $dir) {
            Get-ChildItem $dir | Select-Object Name, Length
          } else {
            Write-Host "No .audit_output directory"
          }

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-report
          path: .audit_output/*.md
          if-no-files-found: error